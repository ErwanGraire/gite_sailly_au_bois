<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau mot de passe | Gîte de Sailly-au-Bois</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .reset-wrapper {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .reset-box {
            max-width: 450px;
            width: 100%;
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            border: 1px solid #eee;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }
        .form-group-reset {
            margin-bottom: 20px;
        }
        .form-group-reset label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--dark);
        }
        .form-group-reset input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .form-group-reset input:focus {
            outline: none;
            border-color: var(--primary);
        }
    </style>
</head>
<body style="background: var(--light-gray);">

<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7v10c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-10-5zm0 18c-4.41 0-8-3.59-8-8V8l8-4 8 4v4c0 4.41-3.59 8-8 8z"/>
                </svg>
            </div>
            <span>Gîte Sailly</span>
        </a>
    </div>
</nav>

<div class="reset-wrapper">
    <div class="reset-box">
        <h2 style="font-family: var(--serif); color: var(--dark); font-size: 1.6rem; margin-bottom: 8px;">Nouveau mot de passe</h2>
        <p id="reset-intro" style="color: #64748b; font-size: 0.92rem; margin-bottom: 22px;">
            Choisissez votre nouveau mot de passe sécurisé (6 caractères minimum).
        </p>

        <div id="reset-message" style="display: none; padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 18px; line-height: 1.4;"></div>

        <form id="form-reset-password">
            <div class="form-group-reset">
                <label for="nouveau-mdp">Nouveau mot de passe</label>
                <input type="password" id="nouveau-mdp" required minlength="6" placeholder="••••••••">
            </div>
            <div class="form-group-reset">
                <label for="confirmer-mdp">Confirmer le mot de passe</label>
                <input type="password" id="confirmer-mdp" required minlength="6" placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-hero" style="width: 100%; border: none; cursor: pointer; padding: 13px; border-radius: 50px;">
                Mettre à jour le mot de passe
            </button>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const msgBox = document.getElementById('reset-message');
    const form = document.getElementById('form-reset-password');

    const utilisateurs = JSON.parse(localStorage.getItem('utilisateurs') || '[]');
    const userIndex = utilisateurs.findIndex(u => u.resetToken === token && u.resetTokenExpires > Date.now());

    // Vérification du token
    if (!token || userIndex === -1) {
        form.style.display = 'none';
        msgBox.style.display = 'block';
        msgBox.style.background = '#fee2e2';
        msgBox.style.color = '#991b1b';
        msgBox.style.border = '1px solid #f87171';
        msgBox.innerHTML = `Ce lien de réinitialisation est invalide ou a expiré.<br><br><a href="auth.html" style="color: #991b1b; font-weight: bold; text-decoration: underline;">Retourner à la page de connexion</a>`;
        return;
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const mdp = document.getElementById('nouveau-mdp').value;
        const confirmMdp = document.getElementById('confirmer-mdp').value;

        if (mdp.length < 6) {
            msgBox.style.display = 'block';
            msgBox.style.background = '#fee2e2';
            msgBox.style.color = '#991b1b';
            msgBox.style.border = '1px solid #f87171';
            msgBox.textContent = "Le mot de passe doit comporter au moins 6 caractères.";
            return;
        }

        if (mdp !== confirmMdp) {
            msgBox.style.display = 'block';
            msgBox.style.background = '#fee2e2';
            msgBox.style.color = '#991b1b';
            msgBox.style.border = '1px solid #f87171';
            msgBox.textContent = "Les deux mots de passe ne correspondent pas.";
            return;
        }

        // Enregistrement cohérent avec auth.js (clé password encodée en btoa)
        utilisateurs[userIndex].password = btoa(mdp);
        delete utilisateurs[userIndex].resetToken;
        delete utilisateurs[userIndex].resetTokenExpires;
        localStorage.setItem('utilisateurs', JSON.stringify(utilisateurs));

        form.style.display = 'none';
        msgBox.style.display = 'block';
        msgBox.style.background = '#ecfdf5';
        msgBox.style.color = '#065f46';
        msgBox.style.border = '1px solid #34d399';
        msgBox.innerHTML = `✅ Mot de passe modifié avec succès !<br>Redirection vers la connexion dans quelques secondes...`;

        setTimeout(() => {
            window.location.href = 'auth.html';
        }, 2500);
    });
});
</script>
</body>
</html>
