<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Compte - Gîte de Sailly-au-Bois</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mon-compte.css">

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("Cj8CA4NPKdZs8yQxe");
        })();
    </script>

    <style>
        .client-tab {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .client-tab:hover { 
            background: #e2e8f0; 
        }
        .client-tab.active {
            background: var(--primary, #2f855a);
            color: white;
        }
        .client-tab.active span {
            background: rgba(255,255,255,0.25) !important;
            color: white !important;
        }
        .card-sejour {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .card-sejour:hover {
            border-color: #cbd5e1;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo"><span>Gîte Sailly</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Accueil</a></li>
            <li><a href="gite.html">Le Gîte</a></li>
            <li><a href="decouvrir.html">Découvrir</a></li>
            <li id="nav-auth-container"></li>
        </ul>
    </div>
</nav>

<div class="container account-page-wrapper">
    <h2 class="section-title">Mon Espace Personnel</h2>

    <div class="account-grid">
        <aside class="profile-card">
            <div class="profile-info">
                <div class="profile-avatar-container">
                    <div id="user-avatar" class="profile-avatar">?</div>
                    <label for="upload-photo" class="photo-edit-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="white">
                            <path d="M3 4V1a1 1 0 0 1 2 0v3h3a1 1 0 0 1 0 2H5v3a1 1 0 0 1-2 0V6H0a1 1 0 0 1 0-2h3zM6 10V7h3a3 3 0 0 0 6 0h3v3h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V11a1 1 0 0 1 1-1h4z"/>
                        </svg>
                    </label>
                    <input type="file" id="upload-photo" style="display:none" accept="image/*">
                </div>

                <div class="info-group">
                    <label>NOM COMPLET</label>
                    <input type="text" id="edit-nom" class="profile-input">
                </div>

                <div class="info-group">
                    <label>TÉLÉPHONE</label>
                    <input type="tel" id="edit-tel" class="profile-input">
                </div>

                <div class="info-group">
                    <label>ADRESSE EMAIL (Identifiant)</label>
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 5px;">
                        <p id="user-email" style="margin:0; font-weight: 600; word-break: break-all;"></p>
                        <span id="status-badge"></span>
                    </div>

                    <div id="verification-zone" style="display:none; margin-top: 15px; background: #fff5f5; padding: 15px; border-radius: 10px; border: 1px solid #feb2b2;">
                        <p style="font-size: 0.85rem; color: #c53030; margin-bottom: 8px; line-height: 1.4;">
                            ⚠️ Votre compte n'est pas vérifié. Certaines fonctionnalités peuvent être limitées.
                        </p>
                        <button onclick="envoyerLienValidation()" class="btn-small-link" style="color: var(--primary); font-weight: bold; text-decoration: underline; display: block;">
                            Recevoir le lien de validation par email
                        </button>
                    </div>
                </div>

                <button onclick="enregistrerModifications()" class="btn btn-hero" style="width: 100%; margin-bottom: 15px;">
                    Enregistrer les modifications
                </button>

                <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">

                <h4 style="margin-bottom: 20px; font-family: var(--serif);">Sécurité</h4>

                <div class="info-group">
                    <label>ANCIEN MOT DE PASSE</label>
                    <input type="password" id="old-password" class="profile-input" placeholder="••••••••">
                </div>

                <div class="info-group">
                    <label>NOUVEAU MOT DE PASSE</label>
                    <input type="password" id="new-password" class="profile-input" placeholder="••••••••">
                </div>

                <button onclick="changerMotDePasse()" class="btn btn-nav" style="width: 100%; background: #555; border: none; margin-bottom: 15px;">
                    Mettre à jour le mot de passe
                </button>

                <p id="password-message" style="display:none; margin-top: 10px; font-size: 0.85rem; font-weight: 600;"></p>

                <button onclick="deconnecter()" class="btn btn-logout">
                    Se déconnecter
                </button>

                <p id="update-message" style="display:none; margin-top: 15px; font-size: 0.85rem; font-weight: 600;"></p>
            </div>
        </aside>

        <!-- ZONE DES SÉJOURS ORGANISÉS -->
        <main class="reservations-card">
            <h4 style="margin-top: 0; margin-bottom: 16px;">Mes demandes de séjour</h4>

            <!-- Onglets de tri -->
            <div style="display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap;">
                <button class="client-tab active" data-tab="validees" onclick="changerFiltreClient('validees')">
                    Confirmées <span id="client-count-validees" style="background: rgba(0,0,0,0.06); padding: 2px 7px; border-radius: 10px; font-size: 0.75rem;">0</span>
                </button>
                <button class="client-tab" data-tab="attente" onclick="changerFiltreClient('attente')">
                    En attente <span id="client-count-attente" style="background: rgba(0,0,0,0.06); padding: 2px 7px; border-radius: 10px; font-size: 0.75rem;">0</span>
                </button>
                <button class="client-tab" data-tab="historique" onclick="changerFiltreClient('historique')">
                    Annulées / Passées <span id="client-count-historique" style="background: rgba(0,0,0,0.06); padding: 2px 7px; border-radius: 10px; font-size: 0.75rem;">0</span>
                </button>
            </div>

            <!-- Liste des réservations filtrées -->
            <div id="reservations-list">
                <p class="no-res">Recherche de vos séjours en cours...</p>
            </div>
        </main>
    </div>
</div>

<!-- MODALE LIVRET D'ACCUEIL & MODALITÉS DU GÎTE -->
<div id="modal-details-sejour" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.65); z-index: 3000; align-items: center; justify-content: center; backdrop-filter: blur(2px);">
    <div style="background: white; border-radius: 16px; width: 92%; max-width: 550px; max-height: 90vh; overflow-y: auto; padding: 26px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 16px;">
            <h3 style="margin: 0; font-family: var(--serif); color: #1e293b;" id="modal-logement-titre">Modalités d'arrivée</h3>
            <button onclick="fermerModalSejour()" style="background: none; border: none; font-size: 1.4rem; color: #64748b; cursor: pointer;">✕</button>
        </div>

        <div id="modal-sejour-contenu">
            <!-- Rempli dynamiquement par mon-compte.js -->
        </div>

        <div style="text-align: right; margin-top: 20px;">
            <button onclick="fermerModalSejour()" class="btn-action btn-valider" style="padding: 9px 20px; font-size: 0.85rem;">Fermer</button>
        </div>
    </div>
</div>

<script src="auth-utils.js"></script>
<script src="mon-compte.js"></script>
</body>
</html>
