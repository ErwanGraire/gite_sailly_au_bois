<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration — Gîte Sailly</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            emailjs.init("Cj8CA4NPKdZs8yQxe");
        })();
    </script>

    <style>
        body { background-color: #f8fafc; }
        .admin-container { margin-top: 90px; padding-bottom: 60px; }
        .admin-section { 
            background: white; 
            border-radius: 16px; 
            padding: 28px; 
            margin-bottom: 32px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.04); 
            border: 1px solid #eef2f6; 
        }

        /* Barre d'outils et filtres */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid #f1f5f9;
        }

        .status-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: #f1f5f9;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn:hover { background: #e2e8f0; }

        .tab-btn.active {
            background: var(--primary, #2f855a);
            color: white;
        }

        .tab-btn .count {
            display: inline-block;
            background: rgba(0,0,0,0.08);
            padding: 2px 7px;
            border-radius: 12px;
            font-size: 0.75rem;
            margin-left: 6px;
        }

        .tab-btn.active .count {
            background: rgba(255,255,255,0.25);
            color: white;
        }

        .filter-select {
            padding: 9px 14px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            font-size: 0.85rem;
            background: white;
            font-family: inherit;
            color: #334155;
            outline: none;
        }

        /* Tableau épuré */
        .table-responsive {
            overflow-x: auto;
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0;
        }

        th { 
            background: #f8fafc; 
            color: #64748b; 
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 12px 16px;
            border-bottom: 2px solid #edf2f7;
            font-weight: 700;
        }

        td { 
            padding: 16px; 
            border-bottom: 1px solid #f1f5f9; 
            vertical-align: middle;
            font-size: 0.9rem;
            color: #1e293b;
        }

        tr:hover td {
            background-color: #fafbfd;
        }

        /* Badges de statut */
        .badge { 
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px; 
            border-radius: 20px; 
            font-size: 0.75rem; 
            font-weight: 700; 
        }
        .badge-attente { background: #fef3c7; color: #b45309; }
        .badge-valide { background: #dcfce7; color: #15803d; }
        .badge-annule { background: #fee2e2; color: #b91c1c; }

        .logement-tag {
            font-weight: 700; 
            color: #274c2f; 
            background: #eaf3ea; 
            padding: 5px 12px; 
            border-radius: 8px; 
            font-size: 0.8rem; 
            display: inline-block;
            white-space: nowrap;
        }

        /* Boutons d'action */
        .action-group {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .btn-action { 
            padding: 6px 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            border: none; 
            font-size: 0.78rem; 
            font-weight: 600;
            transition: opacity 0.2s ease;
        }
        .btn-action:hover { opacity: 0.88; }
        .btn-valider { background: #16a34a; color: white; }
        .btn-refuser { background: #dc2626; color: white; }
        .btn-suppr { background: #f1f5f9; color: #94a3b8; }
        .btn-suppr:hover { color: #dc2626; background: #fee2e2; }

        /* Overlay connexion */
        #admin-login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 2000;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

<div id="admin-login-overlay">
    <div class="booking-form" style="max-width: 380px; width: 90%; text-align: center; background: white; padding: 32px; border-radius: 16px;">
        <h2 style="font-family: var(--serif); margin-bottom: 20px;">Espace Propriétaire</h2>
        <div class="form-group" style="margin-bottom: 14px;">
            <input type="email" id="admin-email" placeholder="admin@gite-sailly.fr" required style="width: 100%;">
        </div>
        <div class="form-group" style="margin-bottom: 14px;">
            <input type="password" id="admin-password" placeholder="Mot de passe" required style="width: 100%;">
        </div>
        <button onclick="tentativeConnexionAdmin()" class="btn btn-hero" style="width: 100%;">Se connecter</button>
        <p id="admin-error" style="color: #c33; margin-top: 15px; font-size: 0.85rem; display: none;">Identifiants incorrects.</p>
        <a href="index.html" style="display: block; margin-top: 20px; color: #64748b; font-size: 0.85rem;">Retour au site</a>
    </div>
</div>

<nav class="navbar">
    <div class="container nav-container">
        <a href="index.html" class="logo"><span>Admin Gîte</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Retour au site</a></li>
            <li><button onclick="deconnecterAdmin()" class="btn-action btn-refuser" style="padding: 8px 16px;">Quitter</button></li>
        </ul>
    </div>
</nav>

<div class="container admin-container">
    <h2 class="section-title" style="text-align: left; margin-bottom: 25px;">Tableau de bord propriétaire</h2>

    <!-- CALENDRIER VISUEL -->
    <div class="admin-section">
        <h3 style="margin-top:0; margin-bottom: 15px;">Planning visuel des hébergements</h3>
        <div id="calendar-container"></div>
    </div>

    <!-- GESTION DES RÉSERVATIONS -->
    <div class="admin-section">
        <div class="toolbar">
            <!-- Onglets d'état -->
            <div class="status-tabs">
                <button class="tab-btn active" data-status="en-attente" onclick="changerOngletStatut('en-attente')">
                    À traiter <span class="count" id="count-attente">0</span>
                </button>
                <button class="tab-btn" data-status="confirmee" onclick="changerOngletStatut('confirmee')">
                    Validées <span class="count" id="count-validees">0</span>
                </button>
                <button class="tab-btn" data-status="annulee" onclick="changerOngletStatut('annulee')">
                    Annulées <span class="count" id="count-annulees">0</span>
                </button>
                <button class="tab-btn" data-status="tous" onclick="changerOngletStatut('tous')">
                    Toutes <span class="count" id="count-toutes">0</span>
                </button>
            </div>

            <!-- Filtre Logement -->
            <div>
                <select id="filtre-table-logement" class="filter-select" onchange="chargerDonneesAdmin()">
                    <option value="tous">Tous les hébergements</option>
                    <option value="Domaine complet">Domaine complet</option>
                    <option value="La Bergerie">La Bergerie</option>
                    <option value="L'Écurie">L'Écurie</option>
                    <option value="L'Étable">L'Étable</option>
                    <option value="Le Pigeonnier">Le Pigeonnier</option>
                    <option value="Le Grenier">Le Grenier</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Client</th>
                        <th>Hébergement</th>
                        <th>Dates du séjour</th>
                        <th>Remarque client</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-res-body"></tbody>
            </table>
        </div>
    </div>

    <!-- UTILISATEURS INSCRITS -->
    <div class="admin-section">
        <h3 style="margin-top:0; margin-bottom: 15px;">Clients enregistrés</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Compte</th>
                        <th>Téléphone</th>
                        <th>Date d'inscription</th>
                    </tr>
                </thead>
                <tbody id="admin-users-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="auth-utils.js"></script>
<script src="calendrier.js"></script>
<script src="admin.js"></script>
</body>
</html>
